name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Vorab-Rendering der Unterseiten (für Suchmaschinen)
        continue-on-error: true
        run: |
          cp public/sitemap.xml dist/sitemap.xml
          npm install --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          sleep 8
          node scripts/prerender.mjs
      - name: 404-Seite für Routen als Kopie von index.html
        run: cp dist/index.html dist/404.html
      - name: Upload auf REG.RU-Hosting (SFTP)
        continue-on-error: true
        timeout-minutes: 15
        env:
          REGRU_HOST: ${{ secrets.REGRU_HOST }}
          REGRU_USER: ${{ secrets.REGRU_USER }}
          REGRU_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          REGRU_PATH: ${{ secrets.REGRU_PATH }}
        run: |
          if [ -z "$REGRU_HOST" ] || [ -z "$REGRU_PASSWORD" ]; then
            echo "REG.RU-Zugangsdaten noch nicht hinterlegt - Upload uebersprungen."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          H="${REGRU_HOST#*://}"; H="${H%%/*}"; H="${H%%:*}"; H="$(echo "$H" | tr -d "[:space:]")"
          ZIEL="${REGRU_PATH:-www/govorim-pravilno.ru}"
          B=sftp-batch.txt
          : > "$B"
          echo "cd $ZIEL" >> "$B"
          (cd dist && find . -mindepth 1 -type d | sed 's#^\./##' | sort) | while read -r d; do echo "-mkdir \"$d\"" >> "$B"; done
          (cd dist && find . -type f | sed 's#^\./##') | while read -r f; do echo "put \"dist/$f\" \"$f\"" >> "$B"; done
          echo "bye" >> "$B"
          echo "Befehle im Upload: $(wc -l < "$B")"
          timeout 840 sshpass -p "$REGRU_PASSWORD" sftp -oStrictHostKeyChecking=no -oConnectTimeout=20 -b "$B" "$REGRU_USER@$H" > sftp-upload.log 2>&1
          rc=$?
          echo "sftp exit code: $rc"
          tail -5 sftp-upload.log | sed "s#$H#HOST#g"
          exit $rc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
