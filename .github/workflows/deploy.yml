name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Vorab-Rendering der Unterseiten (für Suchmaschinen)
        continue-on-error: true
        run: |
          cp public/sitemap.xml dist/sitemap.xml
          npm install --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          sleep 8
          node scripts/prerender.mjs
      - name: 404-Seite für Routen als Kopie von index.html
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
