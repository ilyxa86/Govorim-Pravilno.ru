name: DNS Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Collect DNS facts
        run: |
          set +e
          {
            echo "=== NS (8.8.8.8) ==="
            dig @8.8.8.8 +short NS govorim-pravilno.ru
            echo "=== A apex (8.8.8.8) ==="
            dig @8.8.8.8 +noall +answer A govorim-pravilno.ru
            echo "=== A apex (ns1.reg.ru) ==="
            dig @ns1.reg.ru +noall +answer A govorim-pravilno.ru
            echo "=== A www (8.8.8.8) ==="
            dig @8.8.8.8 +noall +answer A www.govorim-pravilno.ru
            echo "=== AAAA apex ==="
            dig @8.8.8.8 +noall +answer AAAA govorim-pravilno.ru
            echo "=== CNAME apex ==="
            dig @8.8.8.8 +noall +answer CNAME govorim-pravilno.ru
            echo "=== HTTP apex ==="
            curl -sS -I --max-time 20 http://govorim-pravilno.ru/ 2>&1 | head -20
            echo "=== HTTPS pages url ==="
            curl -sS -o /dev/null -w 'code=%{http_code}\n' --max-time 20 https://ilyxa86.github.io/Govorim-Pravilno.ru/ 2>&1
            echo "=== HTTP apex BODY ==="
            curl -sS --max-time 25 http://govorim-pravilno.ru/ | head -c 2400
            echo
            echo "=== HTTP www ==="
            curl -sS -o /dev/null -w 'code=%{http_code}\n' --max-time 25 http://www.govorim-pravilno.ru/
            echo "=== HTTP apex /assets probe ==="
            A=$(curl -sS --max-time 25 http://govorim-pravilno.ru/ | grep -o '/assets/[^"]*\.js' | head -1)
            echo "asset=$A"
            curl -sS -o /dev/null -w 'code=%{http_code} size=%{size_download}\n' --max-time 25 "http://govorim-pravilno.ru$A"
            echo "=== CNAME file served ==="
            curl -sS --max-time 25 http://govorim-pravilno.ru/CNAME
            echo
          } > dns-result.txt 2>&1
          cat dns-result.txt

      - name: Publish result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B dns-result
          git add -f dns-result.txt
          git commit -m "DNS result $(date -u +%FT%TZ)"
          git push -f origin dns-result
