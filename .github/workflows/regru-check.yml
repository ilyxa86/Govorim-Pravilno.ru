name: REG.RU Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verbindung zum REG.RU-Hosting testen
        env:
          REGRU_HOST: ${{ secrets.REGRU_HOST }}
          REGRU_USER: ${{ secrets.REGRU_USER }}
          REGRU_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass netcat-openbsd >/dev/null
          H="${REGRU_HOST#*://}"; H="${H%%/*}"; H="${H%%:*}"; H="$(echo "$H" | tr -d "[:space:]")"
          {
            echo "=== Runner-IP-Land ==="
            curl -s --max-time 10 https://ipinfo.io/country
            echo "=== Host-Format ==="
            echo "bereinigt: laenge=${#H} hat_protokoll=$(echo "$H" | grep -c "://") endung=${H##*.}"; echo "roh: laenge=${#REGRU_HOST} hat_protokoll=$(echo "$REGRU_HOST" | grep -c '://') hat_leerzeichen=$(echo "$REGRU_HOST" | grep -c ' ')"
            echo "user_laenge=${#REGRU_USER} user_beginnt_mit_u=$(echo "$REGRU_USER" | grep -c '^u[0-9]')"
            echo "passwort_gesetzt=$([ -n "$REGRU_PASSWORD" ] && echo ja || echo nein)"
            echo "=== Port 22 (SFTP) ==="
            timeout 25 nc -vz -w 15 "$H" 22 2>&1 | sed "s#$H#HOST#g"
            echo "=== Port 21 (FTP) ==="
            timeout 25 nc -vz -w 15 "$H" 21 2>&1 | sed "s#$H#HOST#g"
            echo "=== Port 80 (HTTP) ==="
            timeout 25 nc -vz -w 15 "$H" 80 2>&1 | sed "s#$H#HOST#g"
            echo "=== SSH-Banner ==="
            timeout 20 bash -c "exec 3<>/dev/tcp/$H/22 && head -c 80 <&3" 2>&1 | sed "s#$H#HOST#g"
            echo
            echo "=== SFTP-Login + Verzeichnis ==="
            timeout 90 sshpass -p "$REGRU_PASSWORD" sftp -oStrictHostKeyChecking=no -oConnectTimeout=20 -oBatchMode=no "$REGRU_USER@$H" <<'SFTP' 2>&1 | sed "s#$H#HOST#g" | head -60
          pwd
          ls -la
          ls -la www
          ls www/govorim-pravilno.ru
          SFTP
            echo "exit=$?"
            echo "=== Seite ueber den Hosting-Server (HTTP) ==="
            for u in / /services /blog/speech-development-tips /games/lopni-puzyr /sitemap.xml /gibt-es-nicht; do
              code=$(curl -s -o /tmp/p.html -w '%{http_code}' --max-time 20 -L -H "Host: govorim-pravilno.ru" "http://$H$u")
              echo "$u -> $code $(grep -o '<title>[^<]*' /tmp/p.html | head -1)"
            done
            echo "=== Asset ==="
            A=$(curl -s --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/" | grep -o '/assets/[^"]*\.js' | head -1)
            curl -s -o /dev/null -w "$A -> %{http_code} %{size_download} bytes\n" --max-time 30 -H "Host: govorim-pravilno.ru" "http://$H$A"
          } > regru-result.txt 2>&1
          cat regru-result.txt
      - name: Ergebnis veroeffentlichen
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -B regru-result
          git add -f regru-result.txt
          git commit -m "REG.RU check $(date -u +%FT%TZ)"
          git push -f origin regru-result
