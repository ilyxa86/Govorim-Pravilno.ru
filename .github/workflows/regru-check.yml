name: REG.RU Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hosting prüfen
        env:
          REGRU_HOST: ${{ secrets.REGRU_HOST }}
          REGRU_USER: ${{ secrets.REGRU_USER }}
          REGRU_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          H="${REGRU_HOST#*://}"; H="${H%%/*}"; H="${H%%:*}"; H="$(echo "$H" | tr -d '[:space:]')"
          {
            echo "=== ROOT ==="
            curl -s --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/" | grep -o '<title>[^<]*' | head -1
            for u in /services /services/miofunktsionalnaya-korrektsiya-rechi /blog/speech-development-tips /games/lopni-puzyr /materials /sitemap.xml /robots.txt /gibt-es-nicht; do
              echo "$u -> $(curl -s -o /tmp/x -w '%{http_code}' --max-time 20 -L -H "Host: govorim-pravilno.ru" "http://$H$u") $(grep -o '<title>[^<]*' /tmp/x | head -1)"
            done
            echo "=== JS-ASSET ==="
            A=$(curl -s --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/" | grep -o '/assets/index[^"]*\.js' | head -1)
            echo "asset=$A $(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 30 -H "Host: govorim-pravilno.ru" "http://$H$A")"
            echo "=== HTTP-Header Startseite ==="
            curl -s -I --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/" | head -5
          } > regru-result.txt 2>&1
          cat regru-result.txt
      - name: Ergebnis veroeffentlichen
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -B regru-result
          git add -f regru-result.txt
          git commit -m "REG.RU check $(date -u +%FT%TZ)"
          git push -f origin regru-result
