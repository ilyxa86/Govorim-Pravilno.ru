name: REG.RU Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hosting prüfen
        env:
          REGRU_HOST: ${{ secrets.REGRU_HOST }}
          REGRU_USER: ${{ secrets.REGRU_USER }}
          REGRU_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          H="${REGRU_HOST#*://}"; H="${H%%/*}"; H="${H%%:*}"; H="$(echo "$H" | tr -d '[:space:]')"
          {
            echo "=== LISTING ==="
            printf 'cd www/govorim-pravilno.ru\nls -l index.html\nls -l sitemap.xml\nls -1 | wc -l\nls -1 assets | wc -l\nbye\n' > diag.txt
            timeout 90 sshpass -p "$REGRU_PASSWORD" sftp -oStrictHostKeyChecking=no -oConnectTimeout=20 -oBatchMode=no -b diag.txt "$REGRU_USER@$H" 2>&1 | sed "s#$H#HOST#g" | grep -av "^sftp>"
            echo "=== ROOT (Host-Header) ==="
            curl -s --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/" | head -c 400; echo
            echo "=== SITEMAP ==="
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/sitemap.xml"
            echo "=== SERVICES ==="
            curl -s --max-time 20 -H "Host: govorim-pravilno.ru" "http://$H/services" | grep -o '<title>[^<]*' | head -1
          } > regru-result.txt 2>&1
          cat regru-result.txt
      - name: Ergebnis veroeffentlichen
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -B regru-result
          git add -f regru-result.txt
          git commit -m "REG.RU check $(date -u +%FT%TZ)"
          git push -f origin regru-result
